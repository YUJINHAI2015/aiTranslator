      background: #f8f9fa;
      border-radius: 10px;
      transition: all 0.3s;
    }
    .feature-item:hover {

      margin-right: 16px;

      margin-bottom: 24px;

    .license-key {

      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      word-break: break-all;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 6px;

    .copy-btn {

    button {

      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;

    .btn-primary:hover {
