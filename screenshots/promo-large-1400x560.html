<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator - 大型宣传图 1400x560</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1400px;
      height: 560px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
      padding: 0 80px;
    }
    .left-content {
      color: white;
      max-width: 600px;
      z-index: 10;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .title {
      font-size: 64px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -1px;
      line-height: 1.1;
    }
    .subtitle {
      font-size: 24px;
      opacity: 0.95;
      margin-bottom: 32px;
      font-weight: 500;
    }
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      font-size: 16px;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.15);
      padding: 12px 16px;
      border-radius: 8px;
      backdrop-filter: blur(10px);
    }
    .feature-icon {
      font-size: 24px;
    }
    .right-content {
      z-index: 10;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 480px;
    }
    .demo-box {
      margin-bottom: 24px;
    }
    .demo-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .demo-text {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .demo-translation {
      font-size: 14px;
      color: #667eea;
      font-weight: 600;
      padding: 12px;
      background: rgba(102, 126, 234, 0.08);
      border-radius: 8px;
    }
    .badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    /* 背景装饰 */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .circle1 {
      width: 300px;
      height: 300px;
      top: -100px;
      right: 200px;
    }
    .circle2 {
      width: 200px;
      height: 200px;
      bottom: -50px;
      left: 100px;
    }
  </style>
</head>
<body>
  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>
  
  <div class="left-content">
    <div class="icon">🌐</div>
    <div class="title">AI Translator</div>
    <div class="subtitle">双击任意文本，即刻翻译全球语言</div>
    
    <div class="features">
      <div class="feature-item">
        <div class="feature-icon">⚡</div>
        <div>极速翻译响应</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🌍</div>
        <div>110+ 语言支持</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🎯</div>
        <div>AI 上下文理解</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">🔒</div>
        <div>隐私安全保护</div>
      </div>
    </div>
  </div>
  
  <div class="right-content">
    <div class="badge">✨ 实时翻译演示</div>
    
    <div class="demo-box">
      <div class="demo-label">📝 原文</div>
      <div class="demo-text">
        Artificial intelligence is revolutionizing translation technology.
      </div>
    </div>
    
    <div class="demo-box">
      <div class="demo-label">🌐 译文</div>
      <div class="demo-translation">
        人工智能正在革新翻译技术。
      </div>
    </div>
    
    <div style="text-align: center; color: #999; font-size: 13px; margin-top: 20px;">
      💡 选中网页任意文本，立即获得精准翻译
    </div>
  </div>
</body>
</html>
