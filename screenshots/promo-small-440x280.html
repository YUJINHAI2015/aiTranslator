<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Translator - 小型宣传图 440x280</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      height: 280px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }
    .container {
      text-align: center;
      color: white;
      z-index: 10;
      padding: 20px;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 500;
    }
    .features {
      margin-top: 16px;
      display: flex;
      gap: 16px;
      justify-content: center;
      font-size: 11px;
      opacity: 0.9;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* 背景装饰 */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }
    .circle1 {
      width: 150px;
      height: 150px;
      top: -50px;
      right: -30px;
    }
    .circle2 {
      width: 100px;
      height: 100px;
      bottom: -20px;
      left: -20px;
    }
  </style>
</head>
<body>
  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>
  
  <div class="container">
    <div class="icon">🌐</div>
    <div class="title">AI Translator</div>
    <div class="subtitle">一键翻译，即刻理解</div>
    <div class="features">
      <div class="feature-item">⚡ 极速</div>
      <div class="feature-item">🎯 精准</div>
      <div class="feature-item">🔒 安全</div>
    </div>
  </div>
</body>
</html>
