<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>付款成功 - AI Translator Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#0a0a0b,#18181b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{background:#fff;border-radius:24px;padding:48px 40px;max-width:480px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
    @keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
    .emoji{font-size:64px;margin-bottom:20px;animation:bounce 1s ease infinite alternate}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    h1{font-size:24px;font-weight:700;color:#1e293b;margin-bottom:8px}
    .sub{font-size:15px;color:#64748b;margin-bottom:28px;line-height:1.6}
    .info-box{background:#f0f1ff;border:1.5px solid #c7d2fe;border-radius:12px;padding:16px 20px;margin-bottom:24px;text-align:left}
    .info-box p{font-size:13px;color:#4338ca;line-height:1.8;margin:0}
    .info-box strong{color:#1e293b}
    .btn{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#6366f1,#7c3aed);color:#fff;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;transition:transform .2s,box-shadow .2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.4)}
    .note{margin-top:20px;font-size:12px;color:#94a3b8}
    .note a{color:#6366f1}
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎉</div>
    <h1>付款成功！</h1>
    <p class="sub">License Key 已发送到你的邮箱<br>请前往邮箱查收（注意检查垃圾邮件）</p>

    <div class="info-box">
      <p>
        📧 <strong>邮件发送时间：</strong>通常在 1 分钟内送达<br>
        📌 <strong>找不到邮件？</strong>检查垃圾邮件文件夹<br>
        🔑 <strong>激活方式：</strong>打开扩展设置 → 粘贴 Key → 点击激活
      </p>
    </div>

    <a class="btn" href="landing.html">← 返回首页</a>

    <p class="note">
      如有问题请联系
      <a href="mailto:roomyu0303@gmail.com">roomyu0303@gmail.com</a>
    </p>
  </div>
</body>
</html>
